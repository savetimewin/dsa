<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Data Structures and Algorithms</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      line-height: 1.6;
      background: #f5f7fb;
      color: #1a1a1a;
    }

    details {
      margin-bottom: 0.85rem;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    summary {
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .toggle-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem;
      height: 1.25rem;
      font-size: 0.8rem;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    details[open] .toggle-arrow {
      transform: rotate(90deg);
    }

    .nav-link {
      color: #111827;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.15s ease;
      flex: 1;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      color: #0f172a;
      text-decoration: underline;
    }

    .sub-items {
      margin-top: 0.9rem;
      display: grid;
      gap: 0.6rem;
    }

    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #111827;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      background: #e2e8f0;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <details>
    <summary>
      <span class="toggle-arrow">▶</span>
      <a class="nav-link" href="arrays-hashing/info/notes-arrays-hashing.html">Arrays & Hashing</a>
    </summary>
    <div class="sub-items">
      <a class="nav-button" href="arrays-hashing/problems/contains-duplicates/contains-duplicates.html">Contains Duplicates</a>
      <a class="nav-button" href="arrays-hashing/problems/two-sum/two-sum.html">Two Sum</a>
      <a class="nav-button" href="arrays-hashing/problems/valid-anagram/valid-anagram.html">Valid Anagram</a>
      <a class="nav-button" href="arrays-hashing/problems/group-anagrams/group-anagrams.html">Group Anagrams</a>
      <a class="nav-button" href="arrays-hashing/problems/top-k-frequent-elements/top-k-frequent-elements.html">Top K Frequent Elements</a>
    </div>
  </details>

  <script>
    // Prevent details toggle when clicking the link, but allow link navigation
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    });
  </script>
</body>
</html>
